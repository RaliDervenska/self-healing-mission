<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>The Self-Healing Mission</title><style>
:root{font-family:system-ui,-apple-system,'Segoe UI',Arial,sans-serif;color:#122e4e;background:#d9ebf4}*{box-sizing:border-box}html{font-size:16px}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 10% 0%,#d4f4fa 0,transparent 48%),radial-gradient(ellipse at 95% 15%,#d9e3ff 0,transparent 45%),linear-gradient(155deg,#eaf4fa,#dbe9f4 65%,#e8eef8)}.wrap{max-width:980px;margin:auto;padding:20px 16px 55px}header{position:relative;overflow:hidden;border:1px solid #78c9e8;background:linear-gradient(122deg,#e9f9ff 0%,#fff 48%,#e0effe 100%);padding:25px 28px;border-radius:22px;box-shadow:0 15px 35px #17416b1a}header:before{content:'';position:absolute;top:0;left:0;width:100%;height:6px;background:linear-gradient(90deg,#e64b60 0 46%,#08a5d5 54% 100%)}header .over{font-size:11px;letter-spacing:2.2px;color:#1974a5;font-weight:850}h1{font-size:clamp(29px,5.4vw,48px);line-height:1.08;letter-spacing:-1px;margin:12px 0;color:#102e54;font-weight:900}h2{font-size:clamp(21px,3vw,28px);line-height:1.18;margin:5px 0 14px;color:#122e52;letter-spacing:-.4px}h3{margin:9px 0 11px;font-size:19px}p{line-height:1.57;margin:12px 0}.muted{color:#55718d}.card{background:#fffdfc;border:1px solid #c0d7e6;border-radius:19px;padding:24px;margin-top:17px;box-shadow:0 9px 22px #193e5b12}.row{display:flex;gap:11px;align-items:center;flex-wrap:wrap}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:14px}.team{position:relative;min-height:150px;padding:21px;border-radius:17px;border:2px solid;cursor:pointer;text-align:left;background:#fff;font:inherit;transition:transform .15s,box-shadow .15s}.red{border-color:#ed5a6c;background:linear-gradient(125deg,#fff3f3,#fff)}.blue{border-color:#22a6d5;background:linear-gradient(125deg,#ecfaff,#fff)}.team:hover{transform:translateY(-2px);box-shadow:0 10px 20px #1d4b6b18}.team b{font-size:24px}.tag{display:inline-block;background:#dceef8;color:#175d87;border-radius:9px;padding:7px 11px;font-size:11px;font-weight:850;letter-spacing:.8px;line-height:1.4}button{font:inherit;font-weight:800;border:0;border-radius:12px;padding:14px 19px;min-height:49px;cursor:pointer;background:linear-gradient(135deg,#0874b6,#065895);color:white;box-shadow:0 4px 10px #0b5c8d1b}button:hover{filter:brightness(1.08)}button:active{transform:translateY(1px)}button:disabled{opacity:.45;cursor:not-allowed}button.secondary{background:#e2eff8;color:#174d75;box-shadow:none}button.warn{background:#a13b38}input{font:inherit;font-size:16px;padding:14px;border:1.5px solid #a5c6d9;border-radius:11px;min-width:0;width:100%;max-width:370px;background:#fff;color:#122e4e;min-height:50px}input:focus-visible,button:focus-visible,summary:focus-visible{outline:3px solid #f1b54b;outline-offset:2px}.challenge{border-left:6px solid #1496d0}.challenge.redside{border-left-color:#df4b63}.challenge.done{background:#f0fbf6;border-color:#2ca86a}.small{font-size:13px}.verse{font-style:italic;white-space:pre-line;background:#eaf5fb;border:1px solid #d8eaf5;padding:16px;border-radius:13px;line-height:1.85;overflow-wrap:anywhere}.status{padding:13px;border-radius:11px;background:#e9f3fb;margin:12px 0;line-height:1.5}.success{background:#e4f8ed;color:#17633d}.error{background:#ffefed;color:#a02b2b}.meter{height:11px;background:#cbddea;border-radius:20px;overflow:hidden}.meter div{height:100%;background:linear-gradient(90deg,#1787d0,#2ac8d4);transition:width .2s}.hidden{display:none!important}.score{font-size:clamp(22px,4vw,28px);font-weight:900;color:#10558a;font-variant-numeric:tabular-nums}.bar{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap}.codepieces{display:flex;gap:8px;flex-wrap:wrap}.codepieces span{background:#e4f1fc;padding:9px 12px;border-radius:9px;font-weight:850;font-size:14px}.redtext{color:#c92d46}.bluetext{color:#0878bd}.alert{border:1px solid #e6a7aa;background:#fff1f0;border-radius:13px;padding:15px}.foot{margin-top:25px;color:#54718b;font-size:12px;line-height:1.5}details{margin-top:14px;padding:12px 13px;background:#f0f7fb;border-radius:12px}summary{cursor:pointer;font-weight:750;line-height:1.5}.actions{margin-top:14px;display:flex;gap:9px;flex-wrap:wrap}.actions input{flex:1 1 220px}.actions button{flex:0 0 auto}#reset-game{font-size:13px} @media(max-width:600px){.wrap{padding:10px 10px 35px}header{padding:20px 17px;border-radius:17px}header .over{font-size:10px;letter-spacing:1.5px}h1{font-size:clamp(27px,8vw,37px);letter-spacing:-.6px}header>div:last-child{font-size:13px;line-height:1.55}.card{padding:17px 15px;margin-top:12px;border-radius:16px}.grid{grid-template-columns:1fr;gap:10px}.team{min-height:110px;padding:16px}.team b{font-size:21px}.tag{font-size:10px;letter-spacing:.45px}.row{align-items:stretch}.row>input{max-width:none;flex:1 1 100%}.row>button{flex:1 1 100%}.actions{display:grid;grid-template-columns:1fr;gap:9px}.actions input,.actions button{width:100%;max-width:none}.verse{padding:14px;font-size:15px}.bar{align-items:flex-start}.bar>.score{width:100%}.score{font-size:23px}.codepieces span{font-size:13px}details{padding:12px}.foot{font-size:11px}button{min-height:50px}input{min-height:50px}#reset-game{width:100%;max-width:360px} .card .grid .alert,.card .grid .status{margin:0} }
@media(max-width:370px){.wrap{padding:7px}.card{padding:14px 12px}h1{font-size:26px}.tag{font-size:9px}.codepieces span{padding:7px 9px}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{transition:none!important;animation:none!important}}

.restored{letter-spacing:2px}.restored span{display:inline-block;opacity:0;animation:pop .35s ease forwards}@keyframes pop{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}</style></head><body><div class="wrap"><header><div class="over">MB MEETS CGI · INTERACTIVE TREASURE HUNT</div><h1>THE SELF-HEALING MISSION</h1><div>From Alert to Pull Request · <strong>Compete to investigate. Collaborate to recover.</strong></div></header><main id="app"></main><div style="text-align:center;margin:18px"><button id="reset-game" class="secondary" onclick="changeTeam()">CHANGE TEAM / NEW GAME</button></div><footer class="foot">Game preview · Fictional incidents only · Progress saved on this device (survives reload) · No server synchronization. Do not use real credentials.</footer></div><script>
const START_CODE='MISSION', FINAL_CODE='RECOVER', REVIEW_PIN='2468'; // DEMO values; change before the event. Client-side PIN is not secure authentication.
const tasks={red:[{id:'R1',title:'THE ISLAND OF 700 SECRETS',envelope:'EVIDENCE 01',answer:'P',intro:'Your investigation begins now! Recover a missing letter from the system recovery code.',riddle:'I am not a country in Europe. I am not a city. I am made up of more than 700 islands. Surrounded by turquoise waters, I hold your first secret.',instruction:'Find the one line that really failed in the SYSTEM LOG. Its first letter is your code fragment.',hints:['The meeting rooms on this floor are named after islands.','WARNING is not a failure. Take the first letter of the service that failed.']},{id:'R2',title:'THE PLACE WHERE IT ALL BEGAN',envelope:'EVIDENCE 02',answer:'RD',intro:'Two letters are missing, but the evidence has been broken into pieces.',riddle:'Every mission starts somewhere,\nAnd yours began before you knew.\nYou received a name, a colour, a number too,\nNow return to where they welcomed you.',instruction:'Assemble the 20-piece picture. Two letters are hidden within it. Read them from left to right and bring them to your Captain.',hints:['Think about the very first thing that happened to you tonight.','Start with the edge pieces. The letters are part of the picture itself.']},{id:'R3',title:'THE ROOT OF THE PROBLEM',envelope:'EVIDENCE 03',answer:'MR',intro:'To solve the incident, you must get to the root of the problem.',riddle:"I bring ideas to life, yet I have no mind.\nI show you things that aren't really mine.\nYou've sat before me, watching stories unfold,\nNow return to discover a secret untold.",instruction:"Inside is a corrupted message. It isn't quite what it seems. Find a way to reveal it, recover two missing letters and bring them to your Captain.",hints:['Where did you sit and watch the keynote?',"The message is mirrored. Use your phone's front camera, then tilt the card."]}],blue:[{id:'B1',title:'THE SLEEPING GIANTS',envelope:'RECOVERY 01',answer:'0',intro:'RECOVERY AGENT ACTIVATED. Recover a missing digit.',riddle:'Two sleeping giants stand side by side.\nUnder their covers, their power hides.\nThey wake with fire, but rest in the cold.\nFind where they sleep, and a number will unfold.',instruction:'Search nearby; do not lift the BBQ covers. Check the RESTART REPORT: how many errors remain AFTER the restart?',hints:['Where would you cook outside in summer?','Count only the errors AFTER the restart.']},{id:'B2',title:'THE HIDDEN PATTERN',envelope:'RECOVERY 02',answer:'3',intro:'The system data contains unexpected anomalies. Identify the irregularities and recover one digit.',riddle:'No need for sunshine, no need for heat,\nHere, strategy and laughter meet.\nSome come to win, some come to play,\nYour missing digit is hidden away.',instruction:'Inside is one corrupted 6 × 6 data matrix. Identify the elements that break the pattern. Their number is your digit.',hints:['Stop reading rows. Look for another direction.','Shapes and directions follow different diagonals.']},{id:'B3',title:'THE CODE REVIEW',envelope:'RECOVERY 03',answer:'35',intro:'The Recovery Agent has prepared eight possible fixes. AI can be fast, confident... and wrong. Humans must review the proposals.',riddle:'Where reggae rhythms fill the air,\nAnd island sunshine is everywhere,\nYour challenge waits in disguise,\nApprove the fix only if it\'s wise.',instruction:'Review the eight Pull Requests using all four policy rules. Add the numbers of approved fixes and bring the total to your Captain.',hints:['Confidence is not a rule. Check only the four rules.','Three fixes pass every rule.']} ]};
const app=document.getElementById('app');const STORE_KEY='shm-captain-state-v1';let state=load();function initial(){return {team:null,started:false,startAt:null,answers:{},hints:{},locks:{},finishAt:null,final:false,code:false,approved:false}}function load(){try{const raw=localStorage.getItem(STORE_KEY);if(!raw)return initial();const s=JSON.parse(raw);if(!s||typeof s!=='object'||(s.team&&!tasks[s.team]))return initial();delete s.patch;return {...initial(),...s}}catch(e){return initial()}}function save(){try{if(!state.team)localStorage.removeItem(STORE_KEY);else localStorage.setItem(STORE_KEY,JSON.stringify(state))}catch(e){}}function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function time(ms){let s=Math.max(0,Math.floor(ms/1000));return `${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`}function penalties(){return Object.values(state.hints).reduce((a,b)=>a+(b.includes(1)?60:0)+(b.includes(2)?120:0),0)*1000}function count(){return tasks[state.team].filter(t=>state.answers[t.id]).length}function render(){if(!state.team)landing();else if(!state.started)ready();else if(state.approved)victory();else if(state.final)finale();else challenges();const reset=document.getElementById('reset-game');if(reset)reset.hidden=false}function landing(){app.innerHTML=`<section class="card"><span class="tag">SYSTEM ALERT · PRODUCTION INCIDENT DETECTED</span><h2>Your mission starts here</h2><p>Two teams have been activated. Neither can restore the system alone. Check your name badge, choose one Captain per team and get ready.</p><div class="grid"><button class="team red" onclick="selectTeam('red')"><b class="redtext">TEAM RED</b><p>The Investigators</p><span>Find out what went wrong →</span></button><button class="team blue" onclick="selectTeam('blue')"><b class="bluetext">TEAM BLUE</b><p>The Fixers</p><span>Find out how to fix it →</span></button></div><p class="small muted">Captain only: use one device per main team. Six sub-teams solve their tasks in parallel.</p></section>`}function ready(){app.innerHTML=`<section class="card"><span class="tag">${state.team.toUpperCase()} · CAPTAIN STATION</span><h2>Ready for the start signal?</h2><p>All three challenges will be available at once. Your sub-teams bring answers to you. Only you submit them.</p><p>Wait for the organizer's start signal. Then tap the button to begin.</p><div class="row"><button onclick="start()">START MISSION</button></div><p id="msg" class="small muted"></p><button class="secondary" onclick="changeTeam()">Change team</button></section>`}function challenges(){let elapsed=(state.finishAt||Date.now())-state.startAt;let p=penalties();let arr=tasks[state.team];app.innerHTML=`<section class="card"><div class="bar"><div><span class="tag">TEAM ${state.team.toUpperCase()} · ${state.team==='red'?'INVESTIGATORS':'FIXERS'}</span><h2>Three parallel challenges</h2></div><div><div class="score" id="clock">${time(elapsed)}</div><div class="small muted">Time + hint penalties: <b>+${time(p)}</b></div></div></div><div class="meter"><div style="width:${count()/3*100}%"></div></div><p>${count()} of 3 challenges completed. Finished early? Help your team!</p></section>`+arr.map((t,i)=>`<section class="card challenge ${state.team==='red'?'redside':''} ${state.answers[t.id]?'done':''}"><div class="bar"><div><span class="tag">SUB-TEAM ${state.team.toUpperCase()} ${i+1} · ${t.id}</span><h2>${esc(t.title)}</h2></div><b>${state.answers[t.id]?'✓ SECURED':'OPEN'}</b></div><p>${esc(t.intro)}</p><p><b>Solve the riddle to discover your destination:</b></p><div class="verse">${esc(t.riddle)}</div><p>Search for a ${state.team.toUpperCase()} envelope marked <b>“${t.envelope}”</b>.</p><p>${esc(t.instruction)}</p><div class="actions"><input id="answer-${t.id}" placeholder="Enter code fragment" autocapitalize="characters" ${state.answers[t.id]?'disabled':''} autocomplete="off"><button ${state.answers[t.id]?'disabled':''} onclick="submitAnswer('${t.id}')">VERIFY</button></div><div id="feedback-${t.id}" class="small status ${state.answers[t.id]?'success':''}">${state.answers[t.id]?'Fragment secured. Saved in Code Inventory.':'Wrong answer? This field locks for 30 seconds.'}</div><details><summary>Need help? Optional hints (+1 or +2 minutes)</summary><div class="actions">${[1,2].map(n=>`<button class="secondary" onclick="hint('${t.id}',${n})">${state.hints[t.id]?.includes(n)?'View':'Reveal'} Hint ${n} (+${n===1?1:2} min)</button>`).join('')}</div><div id="hint-${t.id}" class="status small"></div></details></section>`).join('')+(state.finishAt?`<section class="card"><h2>INDIVIDUAL MISSION COMPLETE</h2><p class="score">Elapsed ${time(elapsed)} · Adjusted ${time(elapsed+p)}</p><p>Show your result to the organizer. The race is over for your team. Meet in the Dining Area when both teams are ready.</p><div class="row"><input id="finalCode" placeholder="Final access code"><button onclick="unlockFinal()">OPEN SHARED FINALE</button></div><p id="finalmsg" class="small"></p></section>`:'')+`<section class="card"><h3>Code Inventory</h3><div class="codepieces">${arr.map(t=>`<span>${t.id}: ${state.answers[t.id]?esc(t.answer):'???'}</span>`).join('')}</div></section>`;if(!state.finishAt){let c=document.getElementById('clock');if(c)c.textContent=time(Date.now()-state.startAt)}}function finale(){let arr=tasks[state.team];let e=Date.now()-state.startAt;app.innerHTML=`<section class="card"><span class="tag">R4 + B4 · THE FINAL CROSSOVER · FULL</span><h2>ALERT → FIX</h2><p>Both teams have finished the race. Now the system can only be restored together.</p><div class="grid"><div class="alert"><h3 class="redtext">TEAM RED · ALERT PANEL</h3><p>Describe every alert: icon, light colour, error code and time. Do not show the other team your sheet.</p></div><div class="status"><h3 class="bluetext">TEAM BLUE · RECOVERY RUNBOOK</h3><p>Ask the Investigators for details. Match icon, colour and error code. Skip self-healed alerts and sort by time.</p></div></div><p><b>Tip:</b> Face each other and choose 1–2 speakers per team. Everyone else helps search.</p><p>Use the physical Alert Panel and Runbook provided by the organizer. Neither team should see the other team's sheet.</p><h3>Recover the missing fragment</h3><p>Some digits are letters in disguise: 0 = O, 3 = E, 5 = S.</p>${!state.code?`<div class="codepieces"><span>TEAM RED: P · RD · MR</span><span>TEAM BLUE: 0 · 3 · 35</span></div>`:''}${!state.code?`<div class="status"><b>MISSING FRAGMENT: _ _ _</b><div class="row"><input id="missing" placeholder="_ _ _" maxlength="3" autocapitalize="characters" autocomplete="off"><button onclick="verifyMissing()">VERIFY</button></div><p id="missingmsg" class="small"></p></div>`:`<h3>All recovered codes</h3><div class="codepieces">${[['R1','P'],['R2','RD'],['R3','MR'],['B1','0'],['B2','3'],['B3','35'],['FINALE','CED']].map(x=>`<span>${x[0]}: ${x[1]}</span>`).join('')}</div><h3>Recovery code restored</h3><div class="score restored">${'PR0D-M3RCED35'.split('').map((c,i)=>`<span style="animation-delay:${i*0.12}s">${c}</span>`).join('')}</div>`}${state.code?`<div class="status success"><h3>PULL REQUEST READY</h3>Code accepted. Show this screen to the Human Reviewer.</div><div class="row"><input id="pin" type="password" placeholder="Human Reviewer PIN"><button onclick="approve()">APPROVE</button></div><p id="pinmsg" class="small"></p>`:''}<details><summary>Optional finale hints (no race-time penalty)</summary><p>Hint 1: Not every alert needs a fix.</p><p>Hint 2: Sort the fixes by time — oldest first.</p></details></section>`}function victory(){let elapsed=state.finishAt-state.startAt;app.innerHTML=`<section class="card" style="text-align:center;padding:50px 20px"><div style="font-size:60px">✓</div><h1>SYSTEM RESTORED</h1><h2>SHARED VICTORY!</h2><p>Compete to investigate. Collaborate to recover.</p><p><b>${state.team.toUpperCase()} team race time:</b> ${time(elapsed)} · <b>Adjusted:</b> ${time(elapsed+penalties())}</p><p class="muted">The organizer compares both Captains' adjusted race times to announce the fastest team.</p><button onclick="newGame()">NEW GAME (RESET THIS DEVICE)</button></section>`}function selectTeam(team){state={...initial(),team};save();render()}function changeTeam(){if(!confirm('Switch team? This will clear progress and time on this device.'))return;state=initial();save();render()}function start(){state.started=true;state.startAt=Date.now();save();render()}function submitAnswer(id){let task=tasks[state.team].find(t=>t.id===id);if(state.answers[id])return;let feedback=document.getElementById('feedback-'+id);if(Date.now()<(state.locks[id]||0)){feedback.textContent='System cooling down. Try again in '+Math.ceil((state.locks[id]-Date.now())/1000)+' seconds.';return}let v=document.getElementById('answer-'+id).value.trim().toUpperCase().replace(/\s+/g,'');if(v===task.answer){state.answers[id]=true;if(count()===3)state.finishAt=Date.now();save();render()}else{state.locks[id]=Date.now()+30000;save();feedback.className='small status error';feedback.textContent='Incorrect code fragment. System cooling down… try again in 30 seconds.'}}function hint(id,n){state.hints[id]??=[];let t=tasks[state.team].find(t=>t.id===id);if(!state.hints[id].includes(n)){if(!confirm(`Reveal Hint ${n}? +${n===1?1:2} minute(s) will be added to your team's final time.`))return;state.hints[id].push(n);save()}document.getElementById('hint-'+id).textContent=t.hints[n-1];let el=document.getElementById('clock');if(el)el.textContent=time((state.finishAt||Date.now())-state.startAt)}function unlockFinal(){let v=document.getElementById('finalCode').value.trim().toUpperCase();if(v!==FINAL_CODE){document.getElementById('finalmsg').textContent='Ask the organizer for the final access code when both teams are ready.';return}state.final=true;save();render()}function verifyMissing(){let v=document.getElementById('missing').value.trim().toUpperCase().replace(/\s+/g,'');if(v==='CED'){state.code=true;save();render()}else document.getElementById('missingmsg').textContent=v==='ECD'?'Right letters, wrong order. Check the alert times.':'Fragment rejected. Match the active alerts and their fixes.'}function approve(){if(document.getElementById('pin').value===REVIEW_PIN){state.approved=true;save();render()}else document.getElementById('pinmsg').textContent='Reviewer PIN not accepted.'}function newGame(){if(confirm('Reset this device for a new round? All progress and timing on this device will be erased.')){state=initial();save();render()}}setInterval(()=>{if(state.started&&!state.finishAt&&!state.final){let el=document.getElementById('clock');if(el)el.textContent=time(Date.now()-state.startAt)}},1000);render();
</script></body></html>
